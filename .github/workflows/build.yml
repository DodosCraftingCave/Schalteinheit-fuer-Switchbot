name: Build App + Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'tool/switchbot_config_v*.py'
      - 'tool/install.py'
      - 'tool/uninstall.py'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}   # erlaubt manuellen Start über den "Run workflow"-Button auf GitHub

permissions:
  contents: write   # nötig für gh release create/upload

jobs:
  # ── 0. Version ermitteln + GitHub Release anlegen ─────────────────
  # Alle Build-Jobs hängen nur noch von diesem einen Job ab (nicht mehr
  # voneinander) und können parallel laufen — sie laden fertige Binaries
  # als Release-Assets hoch statt sie ins Git-Repo zu committen (die Linux-
  # App allein ist >180MB wegen der gebündelten QtWebEngine/Chromium-Engine,
  # das überschreitet GitHubs 100MB-Dateilimit fürs Git-Repo bei weitem).
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.findver.outputs.version }}
      tag: ${{ steps.findver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Tool-Version ermitteln
        id: findver
        run: |
          LATEST=$(ls tool/switchbot_config_v*.py | sort -V | tail -n1)
          VERSION=$(basename "$LATEST" .py | sed 's/^switchbot_config_v//')
          echo "Gefunden: $LATEST → Version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release anlegen (falls für diese Version noch nicht vorhanden)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.findver.outputs.version }}" >/dev/null 2>&1 || \
          gh release create "v${{ steps.findver.outputs.version }}" \
            --title "SwitchBot Konfigurator v${{ steps.findver.outputs.version }}" \
            --notes "Automatisch gebaut von GitHub Actions."

  # ── 1. Die eigentliche App bauen (Windows) ───────────────────────
  build-app-windows:
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        # pythonnet sorgt dafür, dass pywebview unter Windows den modernen
        # EdgeChromium/WebView2-Renderer nutzt (WebView2-Runtime ist auf
        # windows-latest und auf jedem aktuellen Windows 10/11 vorinstalliert)
        # statt auf den veralteten mshtml/Trident-Fallback zurückzufallen,
        # der Flexbox/Grid nicht beherrscht.
        run: pip install pyinstaller requests pywebview pythonnet cryptography

      - name: App bauen (SwitchBot-Konfigurator.exe)
        shell: bash
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "SwitchBot-Konfigurator" \
            "switchbot_config_v${{ needs.prepare-release.outputs.version }}.py"

      - name: Als Release-Asset hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tool/dist
          sha256sum SwitchBot-Konfigurator.exe | cut -d' ' -f1 > SwitchBot-Konfigurator.exe.sha256
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            SwitchBot-Konfigurator.exe SwitchBot-Konfigurator.exe.sha256 --clobber

  # ── 2. Die eigentliche App bauen (Linux) ──────────────────────────
  build-app-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        # Linux-Renderer für pywebview läuft über Qt/QtWebEngine (pip-Wheels,
        # kein apt/gi/GTK-Webkit nötig — das ist unter PyInstaller deutlich
        # zuverlässiger als der GTK-Backend-Pfad von pywebview). BEWUSST kein
        # --collect-all PyQt5 beim Bauen (siehe unten) — das würde zusätzlich
        # zur ohnehin schon riesigen QtWebEngine-Chromium-Engine noch jedes
        # ungenutzte Qt-Modul (Bluetooth, Multimedia, Qml, Sensors, …)
        # mitbündeln und die Binary unnötig weiter aufblähen.
        run: pip install pyinstaller requests pywebview PyQt5 PyQtWebEngine qtpy cryptography

      - name: App bauen (SwitchBot-Konfigurator)
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "SwitchBot-Konfigurator" \
            "switchbot_config_v${{ needs.prepare-release.outputs.version }}.py"

      - name: Als Release-Asset hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tool/dist
          chmod +x SwitchBot-Konfigurator
          sha256sum SwitchBot-Konfigurator | cut -d' ' -f1 > SwitchBot-Konfigurator.sha256
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            SwitchBot-Konfigurator SwitchBot-Konfigurator.sha256 --clobber

  # ── 3. Installer bauen (Windows) — lädt nur die fertige App ──────
  build-installer-windows:
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install pyinstaller

      - name: install_windows.exe bauen
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "install_windows" install.py

      - name: uninstall_windows.exe bauen
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "uninstall_windows" uninstall.py

      - name: Als Release-Assets hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tool/dist
          sha256sum install_windows.exe | cut -d' ' -f1 > install_windows.exe.sha256
          sha256sum uninstall_windows.exe | cut -d' ' -f1 > uninstall_windows.exe.sha256
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            install_windows.exe install_windows.exe.sha256 \
            uninstall_windows.exe uninstall_windows.exe.sha256 --clobber

  # ── 4. Installer bauen (Linux) — lädt nur die fertige App ────────
  build-installer-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          pip install pyinstaller

      - name: install_linux bauen
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "install_linux" install.py

      - name: uninstall_linux bauen
        run: |
          cd tool
          pyinstaller --onefile --windowed --name "uninstall_linux" uninstall.py

      - name: Als Release-Assets hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tool/dist
          chmod +x install_linux uninstall_linux
          sha256sum install_linux | cut -d' ' -f1 > install_linux.sha256
          sha256sum uninstall_linux | cut -d' ' -f1 > uninstall_linux.sha256
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            install_linux install_linux.sha256 \
            uninstall_linux uninstall_linux.sha256 --clobber
